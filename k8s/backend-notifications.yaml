# DEV-ONLY secrets for the notifications service. Must match the notifications role in postgres.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: notifications-secrets
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: pet-1
type: Opaque
stringData:
  DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: pet-1
spec:
  # Several replicas share auth.events through the consumer group (auth.events has 3 partitions,
  # so up to 3 replicas get work); the retry worker in each replica leases rows with SKIP LOCKED.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
    spec:
      containers:
        - name: notifications
          # Built from backend/services/notifications/Dockerfile.dev via Skaffold; tag is set by the build pipeline.
          image: pet-1-notifications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: development
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: notifications
            - name: KAFKA_GROUP_ID
              value: notifications
          envFrom:
            # DATABASE_URL; migrations run on boot (TypeOrmModule migrationsRun).
            - secretRef:
                name: notifications-secrets
            # SMTP_HOST/PORT/USER/PASS, MAIL_FROM from the gitignored k8s/smtp.secret.yaml (copy
            # k8s/smtp.secret.yaml.example). Optional: without it emails wait in email_deliveries.
            - secretRef:
                name: smtp
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: pet-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notifications
  ports:
    - name: http
      port: 80
      targetPort: http
