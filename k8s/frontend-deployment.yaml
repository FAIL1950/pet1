apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: pet-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          # Built from frontend/Dockerfile (currently empty) via Skaffold; tag is set by the build pipeline.
          image: pet-1-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: development
            # Server-side session checks call the auth Service directly (lib/auth/session.ts).
            - name: AUTH_INTERNAL_URL
              value: http://auth
            # Server Components load boards from the boards Service directly (lib/boards/server.ts).
            - name: BOARDS_INTERNAL_URL
              value: http://boards
          # The pod runs `next dev` (Turbopack, under Bun) and compiles routes on demand: it sits at
          # ~450Mi right after start and grows as routes compile; 768Mi got it OOMKilled (→ 502).
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # Compiling a route takes seconds and blocks responses; generous timeouts keep that from
          # failing probes and restarting the pod.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
