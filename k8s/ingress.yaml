apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pet-1
  labels:
    app.kubernetes.io/part-of: pet-1
spec:
  ingressClassName: nginx
  rules:
    - host: pet.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: users
                port:
                  number: 80
          - path: /api/boards
            pathType: Prefix
            backend:
              service:
                name: boards
                port:
                  number: 80
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
