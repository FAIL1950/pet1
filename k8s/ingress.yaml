apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pet-1
  labels:
    app.kubernetes.io/part-of: pet-1
spec:
  ingressClassName: nginx
  rules:
    - host: pet.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
