# DEV-ONLY secrets for the auth service. Must match the auth role in postgres.yaml.
# Google OAuth credentials live in the gitignored k8s/google-oauth.secret.yaml (Secret `google-oauth`,
# template: k8s/google-oauth.secret.yaml.example); Google sign-in is enabled only when it exists.
# Redirect URI to register in Google Console: http://localhost/api/auth/callback/google.
# Google accepts plain http:// redirect URIs only for localhost, hence the app is served at http://localhost.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: pet-1
type: Opaque
stringData:
  DATABASE_URL: postgres://auth:auth@postgres:5432/auth
  BETTER_AUTH_SECRET: dev-only-better-auth-secret-change-me-0123456789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: pet-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
    spec:
      containers:
        - name: auth
          # Built from backend/services/auth/Dockerfile.dev via Skaffold; tag is set by the build pipeline.
          image: pet-1-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: development
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: auth
            - name: BETTER_AUTH_URL
              value: http://localhost
            - name: TRUSTED_ORIGINS
              value: http://localhost,http://localhost:3000
          envFrom:
            # DATABASE_URL, BETTER_AUTH_SECRET.
            - secretRef:
                name: auth-secrets
            # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET; absent Secret just disables Google sign-in.
            - secretRef:
                name: google-oauth
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: pet-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 80
      targetPort: http
