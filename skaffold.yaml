apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: pet-1
build:
  artifacts:
    - image: pet-1-auth
      context: backend
      docker:
        dockerfile: services/auth/Dockerfile.dev
    - image: pet-1-boards
      context: backend
      docker:
        dockerfile: services/boards/Dockerfile.dev
    - image: pet-1-notifications
      context: backend
      docker:
        dockerfile: services/notifications/Dockerfile.dev
    - image: pet-1-frontend
      context: frontend
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  rawYaml:
    - k8s/*.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: frontend
    port: 80
    localPort: 3000
  - resourceType: service
    resourceName: auth
    port: 80
    localPort: 3001
  - resourceType: service
    resourceName: boards
    port: 80
    localPort: 3003
  - resourceType: service
    resourceName: notifications
    port: 80
    localPort: 3004
  - resourceType: service
    resourceName: kafka
    port: 9094
    localPort: 9094
  - resourceType: service
    resourceName: postgres
    port: 5432
    localPort: 5432
